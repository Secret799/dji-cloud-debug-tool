<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title desc">
  <title id="title">航坞联调台</title>
  <desc id="desc">深墨方形底板上，一支暖白准星环包住中心代表设备的橙色圆角方块。</desc>

  <!-- 底板：900 × 900，圆角 218。描边 18 只在 ≥128px 可见，用于压住边缘。 -->
  <rect x="62" y="62" width="900" height="900" rx="218" fill="#20201e" stroke="#3b3b37" stroke-width="18"/>

  <!-- 准星环：r244，笔画 132。外径 620，内径 356。 -->
  <circle cx="512" cy="512" r="244" fill="none" stroke="#fff8f2" stroke-width="132"/>

  <!-- 设备方块：156 × 156，圆角 40。与环内壁留 100 的空隙。 -->
  <rect x="434" y="434" width="156" height="156" rx="40" fill="#f56a00"/>
</svg>