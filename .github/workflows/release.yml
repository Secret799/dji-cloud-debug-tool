name: Build and publish release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests and production build
        run: npm run release:verify

  package:
    name: Package ${{ matrix.label }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            os: macos-15
            platform: mac
            ffmpeg_platform: darwin
            zlm_binary: vendor/zlmediakit/arm64/MediaServer
            arch: arm64
          - label: macOS Intel
            os: macos-15-intel
            platform: mac
            ffmpeg_platform: darwin
            zlm_binary: vendor/zlmediakit/x64/MediaServer
            arch: x64
          - label: Windows x64
            os: windows-2022
            platform: win
            ffmpeg_platform: win32
            zlm_binary: vendor/zlmediakit/win32-x64/MediaServer.exe
            arch: x64
          - label: Windows ARM64
            os: windows-2022
            platform: win
            ffmpeg_platform: win32
            zlm_binary: vendor/zlmediakit/win32-arm64/MediaServer.exe
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use tag as application version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm version "$version" --no-git-tag-version --allow-same-version

      - name: Build application
        run: npm run build

      - name: Restore bundled FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v5
        with:
          path: vendor/ffmpeg/${{ matrix.ffmpeg_platform }}-${{ matrix.arch }}
          key: ffmpeg-v1-${{ matrix.ffmpeg_platform }}-${{ matrix.arch }}-${{ hashFiles('scripts/prepare-ffmpeg-*') }}

      - name: Prepare bundled FFmpeg for macOS
        if: matrix.platform == 'mac' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: bash
        run: npm run prepare:ffmpeg:mac -- ${{ matrix.arch }}

      - name: Prepare bundled FFmpeg for Windows
        if: matrix.platform == 'win' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/prepare-ffmpeg-windows.ps1 -Architecture ${{ matrix.arch }}

      - name: Verify bundled FFmpeg
        shell: bash
        run: |
          ffmpeg_dir="vendor/ffmpeg/${{ matrix.ffmpeg_platform }}-${{ matrix.arch }}"
          if [[ "${{ matrix.platform }}" == "win" ]]; then
            ffmpeg_binary="$ffmpeg_dir/ffmpeg.exe"
          else
            ffmpeg_binary="$ffmpeg_dir/ffmpeg"
          fi
          test -f "$ffmpeg_binary"
          test -f "$ffmpeg_dir/LICENSE"
          test -f "$ffmpeg_dir/SOURCE.txt"
          ls -lh "$ffmpeg_binary" "$ffmpeg_dir/LICENSE" "$ffmpeg_dir/SOURCE.txt"

      - name: Restore bundled ZLMediaKit
        id: zlm-cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ matrix.zlm_binary }}
            vendor/zlmediakit/LICENSE
          key: zlm-v2-${{ matrix.ffmpeg_platform }}-${{ matrix.arch }}-${{ hashFiles('scripts/build-zlmediakit-*') }}

      - name: Build bundled ZLMediaKit for macOS
        if: matrix.platform == 'mac' && steps.zlm-cache.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: npm run build:zlm -- ${{ matrix.arch }}

      - name: Build bundled ZLMediaKit for Windows
        if: matrix.platform == 'win' && steps.zlm-cache.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: pwsh
        run: ./scripts/build-zlmediakit-windows.ps1 -Architecture ${{ matrix.arch }}

      - name: Verify bundled ZLMediaKit
        shell: bash
        run: |
          test -f "${{ matrix.zlm_binary }}"
          test -f vendor/zlmediakit/LICENSE
          ls -lh "${{ matrix.zlm_binary }}" vendor/zlmediakit/LICENSE
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.zlm_binary }}"
          else
            shasum -a 256 "${{ matrix.zlm_binary }}"
          fi

      - name: Package macOS
        if: matrix.platform == 'mac'
        shell: bash
        run: npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never

      - name: Verify macOS ad-hoc signature
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          app_count="$(find release -mindepth 2 -maxdepth 2 -type d -name 'HangarLab Studio.app' | wc -l | tr -d ' ')"
          if [[ "$app_count" != "1" ]]; then
            echo "Expected one packaged macOS app, found $app_count." >&2
            find release -mindepth 2 -maxdepth 2 -type d -name 'HangarLab Studio.app' >&2
            exit 1
          fi
          app_path="$(find release -mindepth 2 -maxdepth 2 -type d -name 'HangarLab Studio.app' -print -quit)"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          signature_details="$(codesign --display --verbose=4 "$app_path" 2>&1)"
          printf '%s\n' "$signature_details"
          if ! grep -q '^Signature=adhoc$' <<< "$signature_details"; then
            echo "Expected an ad-hoc signature." >&2
            exit 1
          fi

      - name: Verify macOS packaged application starts
        if: matrix.platform == 'mac'
        env:
          DEBUG: pw:browser
        shell: bash
        run: |
          app_path="$(find release -mindepth 2 -maxdepth 2 -type d -name 'HangarLab Studio.app' -print -quit)"
          node scripts/macos-package-smoke.mjs "$app_path"

      - name: Package Windows
        if: matrix.platform == 'win'
        shell: bash
        run: npx electron-builder --win nsis portable zip --${{ matrix.arch }} --publish never

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.dmg
            release/*.exe
            release/*.zip
            release/*.blockmap

  upgrade-smoke:
    name: Upgrade smoke (old to new)
    # 只在隔离的 runner 上跑：装旧版、写测试数据、装新版、校验迁移；不碰任何真实用户目录
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: package
    runs-on: macos-15
    timeout-minutes: 30
    env:
      UPGRADE_SMOKE_OLD_VERSION: v1.3.1
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download new package artifact
        uses: actions/download-artifact@v4
        with:
          name: mac-arm64
          path: new-package

      - name: Download previous release package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p old-package
          gh release download "$UPGRADE_SMOKE_OLD_VERSION" --repo "$GITHUB_REPOSITORY" --pattern "*mac-arm64.dmg" --dir old-package
          ls -lh old-package

      - name: Run upgrade smoke
        env:
          UPGRADE_SMOKE_OLD_DIR: old-package
          UPGRADE_SMOKE_NEW_DIR: new-package
          UPGRADE_SMOKE_SCREENSHOT: ${{ runner.temp }}/upgrade-smoke.png
          UPGRADE_SMOKE_REPORT: ${{ runner.temp }}/upgrade-smoke-report.json
        run: node scripts/upgrade-smoke.mjs

      - name: Collect upgrade evidence
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          cp "$RUNNER_TEMP"/upgrade-smoke-report.json "$RUNNER_TEMP"/upgrade-smoke.png "$RUNNER_TEMP/evidence/" 2>/dev/null || true
          for dir in "HangarLab Studio" "DJI Cloud Studio"; do
            target="$HOME/Library/Application Support/$dir"
            if [ -d "$target" ]; then
              mkdir -p "$RUNNER_TEMP/evidence/$dir"
              cp "$target"/*.json "$target"/.user-data-migrated.json "$RUNNER_TEMP/evidence/$dir/" 2>/dev/null || true
            fi
          done
          find "$RUNNER_TEMP/evidence" -type f | sort

      - name: Upload upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-smoke-evidence
          if-no-files-found: warn
          path: ${{ runner.temp }}/evidence

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [package, upgrade-smoke]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Require update signing key
        shell: bash
        env:
          SIGNING_KEY_PRESENT: ${{ secrets.UPDATE_SIGNING_KEY != '' }}
        run: |
          if [ "$SIGNING_KEY_PRESENT" != "true" ]; then
            echo "::error::Configure the UPDATE_SIGNING_KEY Actions secret before releasing." >&2
            exit 1
          fi

      - name: Generate SHA-256 checksums
        shell: bash
        run: cd release && sha256sum -- HangarLab.Studio-* > SHA256SUMS.txt

      - name: Extract release notes
        shell: bash
        run: node scripts/release-notes.mjs "$TAG_NAME" > release-notes.md

      - name: Prepare draft GitHub Release
        shell: bash
        run: |
          state="$(gh release view "$TAG_NAME" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          if [ "$state" = "false" ]; then
            echo "::error::Release $TAG_NAME is already published; published releases are immutable." >&2
            exit 1
          fi
          if [ -z "$state" ]; then
            release_flags=(--draft --verify-tag --title "航坞联调台 $TAG_NAME" --notes-file release-notes.md)
            if [[ "$TAG_NAME" == *-* ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "$TAG_NAME" "${release_flags[@]}"
          fi
          gh release upload "$TAG_NAME" release/* --clobber

      - name: Sign update manifest
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: node scripts/create-update-manifest.mjs "$TAG_NAME" release release-notes.md

      - name: Upload signed update manifest
        shell: bash
        run: gh release upload "$TAG_NAME" release/latest.json release/latest.json.sig --clobber

      - name: Publish GitHub Release
        shell: bash
        run: gh release edit "$TAG_NAME" --draft=false
