name: Build and publish release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests and production build
        run: npm run release:verify

  package:
    name: Package ${{ matrix.label }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            os: macos-14
            platform: mac
            arch: arm64
          - label: macOS Intel
            os: macos-14
            platform: mac
            arch: x64
          - label: Windows x64
            os: windows-2022
            platform: win
            arch: x64
          - label: Windows ARM64
            os: windows-2022
            platform: win
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use tag as application version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm version "$version" --no-git-tag-version --allow-same-version

      - name: Build application
        run: npm run build

      - name: Build bundled ZLMediaKit for Windows
        if: matrix.platform == 'win'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run ci:build:zlm:win -- -Architecture ${{ matrix.arch }}

      - name: Package macOS
        if: matrix.platform == 'mac'
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never

      - name: Package Windows
        if: matrix.platform == 'win'
        shell: bash
        run: npx electron-builder --win nsis portable zip --${{ matrix.arch }} --publish never

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.dmg
            release/*.exe
            release/*.zip
            release/*.blockmap

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: sha256sum release/* > release/SHA256SUMS.txt

      - name: Create or update GitHub Release
        shell: bash
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release/* --clobber
            exit 0
          fi

          release_flags=(--verify-tag --generate-notes --title "DJI Cloud Studio $TAG_NAME")
          if [[ "$TAG_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$TAG_NAME" release/* "${release_flags[@]}"
