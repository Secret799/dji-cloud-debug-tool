name: Build and publish release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests and production build
        run: npm run release:verify

  package:
    name: Package ${{ matrix.label }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            os: macos-14
            platform: mac
            arch: arm64
          - label: macOS Intel
            os: macos-14
            platform: mac
            arch: x64
          - label: Windows x64
            os: windows-2022
            platform: win
            arch: x64
          - label: Windows ARM64
            os: windows-2022
            platform: win
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use tag as application version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm version "$version" --no-git-tag-version --allow-same-version

      - name: Build application
        run: npm run build

      - name: Restore bundled ZLMediaKit for Windows
        if: matrix.platform == 'win'
        id: zlm-cache
        uses: actions/cache@v4
        with:
          path: vendor/zlmediakit/win32-${{ matrix.arch }}/MediaServer.exe
          key: zlm-windows-v1-${{ matrix.arch }}-${{ hashFiles('scripts/build-zlmediakit-windows.ps1') }}

      - name: Build bundled ZLMediaKit for Windows
        if: matrix.platform == 'win' && steps.zlm-cache.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run ci:build:zlm:win -- -Architecture ${{ matrix.arch }}

      - name: Verify bundled ZLMediaKit for Windows
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $mediaServer = "vendor/zlmediakit/win32-${{ matrix.arch }}/MediaServer.exe"
          if (-not (Test-Path -LiteralPath $mediaServer -PathType Leaf)) {
            throw "Missing cached or compiled ZLMediaKit executable: $mediaServer"
          }
          Get-Item -LiteralPath $mediaServer | Select-Object FullName, Length
          Get-FileHash -Algorithm SHA256 -LiteralPath $mediaServer

      - name: Package macOS
        if: matrix.platform == 'mac'
        shell: bash
        run: npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never

      - name: Verify macOS ad-hoc signature
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          app_count="$(find release -mindepth 2 -maxdepth 2 -type d -name 'DJI Cloud Studio.app' | wc -l | tr -d ' ')"
          if [[ "$app_count" != "1" ]]; then
            echo "Expected one packaged macOS app, found $app_count." >&2
            find release -mindepth 2 -maxdepth 2 -type d -name 'DJI Cloud Studio.app' >&2
            exit 1
          fi
          app_path="$(find release -mindepth 2 -maxdepth 2 -type d -name 'DJI Cloud Studio.app' -print -quit)"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          signature_details="$(codesign --display --verbose=4 "$app_path" 2>&1)"
          printf '%s\n' "$signature_details"
          if ! grep -q '^Signature=adhoc$' <<< "$signature_details"; then
            echo "Expected an ad-hoc signature." >&2
            exit 1
          fi

      - name: Package Windows
        if: matrix.platform == 'win'
        shell: bash
        run: npx electron-builder --win nsis portable zip --${{ matrix.arch }} --publish never

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.dmg
            release/*.exe
            release/*.zip
            release/*.blockmap

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: sha256sum release/* > release/SHA256SUMS.txt

      - name: Create or update GitHub Release
        shell: bash
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release/* --clobber
            exit 0
          fi

          release_flags=(--verify-tag --generate-notes --title "DJI Cloud Studio $TAG_NAME")
          if [[ "$TAG_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$TAG_NAME" release/* "${release_flags[@]}"
